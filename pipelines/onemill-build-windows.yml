# OneMill Windows build pipeline - self-hosted EC2 agent
#
# Ported from the `azure-pipelines` branch (commit 8cee220, created by the ADO wizard and then
# adapted from ips-suite2/pipelines/build-validation-windows.yaml). Two of that file's three stages
# are kept VERBATIM because they are correct and hard-won:
#
#   Warmup   - checks how many candidate EC2 instances are already running, starts one if there is
#              capacity, and publishes its id so Shutdown can stop exactly that one
#   Shutdown - stops the instance this run started; `condition: always()` so a failed build still
#              releases it, and it handles the pending-instance case a cancelled Warmup leaves behind
#
# Its third stage (BuildAndTest) was DISCARDED: 52 of its lines are MIRAGE/SuperbuildEngine content
# (MIRAGE_Tests.exe, SB_OUTPUT_KEY, 3rdparty/out/install, MIRAGE-data LFS fixtures), none of which
# exists in OneMill. Dropped rather than half-edited, because a half-ported build stage that appears
# to work is worse than an absent one. SB_CONFIG, SB_OUTPUT_KEY and AWS_ECR_SERVICE_CONNECTION went
# with it; the two kept stages reference none of them - verified by grep, not assumed.
#
# CURRENT PAYLOAD: an agent INVENTORY, not a build. The EC2 instance was forked from a suite-aws-pool
# agent, so it has VS 18 and Qt but almost certainly lacks OneMill's three specific dependencies
# (Qt-enabled VTK 9.5, the licensed ModuleWorks SDK, and vcpkg with the x64-windows-static ports).
# This stage reports what is actually present so provisioning is driven by facts instead of guesses.
# It gets replaced by the real configure/build/install_full once the gaps are closed.
#
# `trigger: none` ON PURPOSE. This pipeline starts a billable EC2 instance, so it must not fire on
# every push to develop the way the guard does. Run it manually until the build stage exists and the
# team has decided whether it should gate develop.

trigger: none
pr: none

variables:
  CANDIDATE_AGENTS: 'i-0acdb789bdfe09eac'
  MAX_CONCURRENT_INSTANCES: 1        # limited by the org's parallel-job allocation
  AWS_SERVICE_CONNECTION: 'OneMill Staging AWS Credentials'
  SELF_HOSTED_POOL: 'onemill-aws-windows-pool'
  QT_VERSION: 6.10.2
  QTDIR: 'C:\Qt\$(QT_VERSION)\msvc2022_64'

stages:
  - stage: Warmup
    displayName: 'Manage Windows Instance Capacity'
    jobs:
      - job: ManageCapacity
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: none
          - task: AWSShellScript@1
            name: CheckCapacity
            displayName: 'Check Capacity and Start Instance if Needed'
            inputs:
              awsCredentials: '$(AWS_SERVICE_CONNECTION)'
              regionName: 'eu-west-1'
              scriptType: 'inline'
              inlineScript: |
                set -e
                
                # Parse candidate instances
                CANDIDATES="$(CANDIDATE_AGENTS)"
                MAX_INSTANCES=$(MAX_CONCURRENT_INSTANCES)
                IFS=',' read -ra INSTANCES <<< "$CANDIDATES"
                
                echo "========================================"
                echo "Checking capacity for pipeline execution"
                echo "Candidate instances: ${INSTANCES[*]}"
                echo "Max concurrent instances: $MAX_INSTANCES"
                echo "========================================"

                # Publish the instance ID the moment the start call succeeds, BEFORE the
                # multi-minute readiness waits: a run cancelled during those waits must still
                # hand the ID to the Shutdown stage, or the instance keeps running forever.
                claim_started_instance() {
                  echo "##vso[task.setvariable variable=StartedInstanceId;isOutput=true]$1"
                }

                # Atomically start AND claim an instance. start-instances succeeds even when the
                # instance is already pending/running, so the exit code alone cannot detect a
                # concurrent Warmup racing us to the same stopped instance. Only the caller that
                # actually flips it stopped -> pending (PreviousState=stopped) owns it; everyone
                # else must treat the instance as taken.
                start_and_claim_instance() {
                  local instance_id="$1"
                  local prev_state

                  prev_state=$(aws ec2 start-instances --instance-ids "$instance_id" \
                    --query 'StartingInstances[0].PreviousState.Name' \
                    --output text 2>/dev/null || echo "start-failed")

                  if [ "$prev_state" != "stopped" ]; then
                    echo "⚠️  Could not claim $instance_id (previous state: $prev_state)"
                    return 1
                  fi

                  claim_started_instance "$instance_id"
                }

                publish_started_instance() {
                  local instance_id="$1"
                  local agent_name

                  agent_name=$(aws ec2 describe-tags \
                    --filters "Name=resource-id,Values=$instance_id" "Name=key,Values=Name" \
                    --query 'Tags[0].Value' \
                    --output text 2>/dev/null || echo "")

                  if [ -z "$agent_name" ] || [ "$agent_name" = "None" ]; then
                    echo "##vso[task.logissue type=error]Instance $instance_id has no Name tag matching its Azure Agent.Name"
                    return 1
                  fi

                  echo "##vso[task.setvariable variable=StartedAgentName;isOutput=true]$agent_name"
                }
                
                # Check current state of all instances
                RUNNING_COUNT=0
                STOPPED_INSTANCES=()
                STOPPING_INSTANCES=()
                
                for instance_id in "${INSTANCES[@]}"; do
                    instance_id=$(echo "$instance_id" | tr -d ' ')
                    
                    STATE=$(aws ec2 describe-instances \
                        --instance-ids "$instance_id" \
                        --query 'Reservations[0].Instances[0].State.Name' \
                        --output text 2>/dev/null || echo "not-found")
                    
                    echo "Instance $instance_id: $STATE"
                    
                    if [ "$STATE" = "running" ] || [ "$STATE" = "pending" ]; then
                        RUNNING_COUNT=$((RUNNING_COUNT + 1))
                    elif [ "$STATE" = "stopped" ]; then
                        STOPPED_INSTANCES+=("$instance_id")
                    elif [ "$STATE" = "stopping" ]; then
                        STOPPING_INSTANCES+=("$instance_id")
                    fi
                done
                
                echo "Currently running/starting: $RUNNING_COUNT instances"
                echo "Available stopped instances: ${#STOPPED_INSTANCES[@]}"
                echo "Currently stopping instances: ${#STOPPING_INSTANCES[@]}"

                if [ "$RUNNING_COUNT" -ge "$MAX_INSTANCES" ]; then
                    echo "❌ ERROR: Capacity limit reached: $RUNNING_COUNT of $MAX_INSTANCES instances are already running or starting."
                    exit 1
                fi

                # Decision logic: prioritize stopped instances, then handle stopping instances
                if [ ${#STOPPED_INSTANCES[@]} -gt 0 ]; then
                    # Try every stopped instance: a lost claim race just means another pipeline
                    # took that one, the next candidate is usually still free.
                    for INSTANCE_TO_START in "${STOPPED_INSTANCES[@]}"; do
                        echo "🚀 Starting stopped instance: $INSTANCE_TO_START"

                        if start_and_claim_instance "$INSTANCE_TO_START"; then
                            aws ec2 wait instance-running --instance-ids "$INSTANCE_TO_START"
                            aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_TO_START"
                            echo "✅ Instance $INSTANCE_TO_START is ready"

                            publish_started_instance "$INSTANCE_TO_START"
                            CLAIMED_INSTANCE=1
                            break
                        fi

                        echo "⚠️  Lost $INSTANCE_TO_START to a concurrent run, trying next stopped instance..."
                    done

                    if [ -z "$CLAIMED_INSTANCE" ]; then
                        echo "❌ ERROR: All stopped instances were claimed by concurrent runs"
                        exit 1
                    fi
                    
                elif [ ${#STOPPING_INSTANCES[@]} -gt 0 ]; then
                    # No stopped instances, but stopping instances available - wait for one
                    echo "⏳ No stopped instances available, but found stopping instances: ${STOPPING_INSTANCES[*]}"
                    echo "Waiting for a stopping instance to become available..."
                    
                    max_wait=120
                    waited=0

                    while [ ${#STOPPING_INSTANCES[@]} -gt 0 ] && [ $waited -lt $max_wait ]; do
                        sleep 15
                        waited=$((waited + 15))
                        STILL_STOPPING=()
                        NEWLY_STOPPED=()
                        
                        for instance_id in "${STOPPING_INSTANCES[@]}"; do
                            STATE=$(aws ec2 describe-instances \
                                --instance-ids "$instance_id" \
                                --query 'Reservations[0].Instances[0].State.Name' \
                                --output text 2>/dev/null || echo "not-found")
                            
                            if [ "$STATE" = "stopping" ]; then
                                STILL_STOPPING+=("$instance_id")
                            elif [ "$STATE" = "stopped" ]; then
                                echo "✅ Instance $instance_id finished stopping"
                                NEWLY_STOPPED+=("$instance_id")
                            fi
                        done
                        
                        # If any instance became available, start it immediately
                        if [ ${#NEWLY_STOPPED[@]} -gt 0 ]; then
                            INSTANCE_TO_START="${NEWLY_STOPPED[0]}"
                            
                            # Double-check the instance is still stopped (race condition protection)
                            CURRENT_STATE=$(aws ec2 describe-instances \
                                --instance-ids "$INSTANCE_TO_START" \
                                --query 'Reservations[0].Instances[0].State.Name' \
                                --output text 2>/dev/null || echo "not-found")
                            
                            if [ "$CURRENT_STATE" = "stopped" ]; then
                                echo "🚀 Starting newly available instance: $INSTANCE_TO_START"
                                
                                # Try to start the instance - may fail if another pipeline grabbed it
                                if start_and_claim_instance "$INSTANCE_TO_START"; then
                                    aws ec2 wait instance-running --instance-ids "$INSTANCE_TO_START"
                                    aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_TO_START"
                                    echo "✅ Instance $INSTANCE_TO_START is ready"
                                    
                                    publish_started_instance "$INSTANCE_TO_START"
                                    CLAIMED_INSTANCE=1
                                    break
                                else
                                    echo "⚠️  Failed to start $INSTANCE_TO_START (likely race condition), continuing search..."
                                fi
                            else
                                echo "⚠️  Instance $INSTANCE_TO_START is no longer stopped ($CURRENT_STATE), continuing search..."
                            fi
                        fi
                        
                        STOPPING_INSTANCES=("${STILL_STOPPING[@]}")
                        
                        if [ ${#STOPPING_INSTANCES[@]} -gt 0 ]; then
                            echo "Still waiting for: ${STOPPING_INSTANCES[*]} ($waited/$max_wait seconds)"
                        fi
                    done

                    # Check the claim flag, NOT the remaining-stopping list: a successful claim
                    # breaks out of the loop with other instances possibly still stopping, and a
                    # lost race can drain the list without any claim.
                    if [ -z "$CLAIMED_INSTANCE" ]; then
                        echo "❌ ERROR: No instance could be claimed within ${max_wait}s"
                        exit 1
                    fi
                else
                    # No stopped or stopping instances available
                    echo "❌ ERROR: No available instances found!"
                    echo "   - Stopped instances: ${#STOPPED_INSTANCES[@]}"
                    echo "   - Stopping instances: ${#STOPPING_INSTANCES[@]}"
                    echo "   - Running instances: $RUNNING_COUNT"
                    exit 1
                fi



  - stage: AgentInventory
    displayName: 'Inventory the build agent (read-only)'
    dependsOn: Warmup
    jobs:
      - job: Inventory
        displayName: 'What is actually installed'
        timeoutInMinutes: 30
        pool:
          name: '$(SELF_HOSTED_POOL)'
        steps:
          - checkout: none        # nothing to build yet - this only interrogates the machine

          - powershell: |
              $ErrorActionPreference = 'Continue'
              # NOTE: do NOT name this helper 'H'. PowerShell aliases 'h' to Get-History, which shadows
              # a single-letter function and turns every call into "Get-History -Id <string>". v1 of this
              # script lost all its section headers that way.
              function Section([string]$title) { Write-Host ""; Write-Host "=== $title ===" }

              Section 'Machine'
              $os = Get-CimInstance Win32_OperatingSystem
              $cs = Get-CimInstance Win32_ComputerSystem
              Write-Host "host      : $env:COMPUTERNAME"
              Write-Host "os        : $($os.Caption) build $($os.BuildNumber)"
              Write-Host "cores     : $($cs.NumberOfLogicalProcessors)   RAM GB: $([math]::Round($cs.TotalPhysicalMemory/1GB,1))"
              Write-Host "agent user: $env:USERNAME   sessionId=$((Get-Process -Id $PID).SessionId) (0 = service session)"
              Get-PSDrive -PSProvider FileSystem | Where-Object { $null -ne $_.Used } |
                Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}} |
                Format-Table -AutoSize | Out-String | Write-Host

              # ------------------------------------------------------------------------------------
              # DISCOVERY FIRST. v1 guessed fixed paths and declared things absent when its guesses
              # missed - it reported "VTK ABSENT" while a lib folder with ITK and VTK was sitting on
              # the machine. So: enumerate what is there before concluding anything.
              # ------------------------------------------------------------------------------------
              Section 'Top level of every fixed drive (what actually exists)'
              foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $null -ne $_.Used })) {
                Write-Host "--- $($d.Name):\ ---"
                Get-ChildItem "$($d.Name):\" -Directory -Force -ErrorAction SilentlyContinue |
                  Sort-Object Name | ForEach-Object { Write-Host "    $($_.Name)" }
              }

              Section 'Candidate dependency roots - one level deep'
              $roots = @('C:\lib','C:\libs','C:\deps','C:\dev','C:\DevTools','C:\build','C:\3rdparty',
                         'C:\ModuleWorks','C:\ModuleWorksSdk','C:\vcpkg','C:\VTK','C:\ITK','C:\opt','C:\tools',
                         'C:\agent','C:\DATA') | Where-Object { Test-Path $_ }
              if (-not $roots) { Write-Host "  none of the usual roots exist" }
              foreach ($r in $roots) {
                Write-Host "--- $r ---"
                Get-ChildItem $r -Directory -Force -ErrorAction SilentlyContinue |
                  Select-Object -First 25 | ForEach-Object { Write-Host "    $($_.Name)" }
              }

              # ------------------------------------------------------------------------------------
              # Find CMake package configs by name, with generous depth. This is what tells us whether
              # a dependency is actually CONSUMABLE by find_package, not merely present on disk.
              # ------------------------------------------------------------------------------------
              Section 'CMake package configs (VTK / ITK / Qt6) - the consumability test'
              $searchRoots = @('C:\lib','C:\libs','C:\deps','C:\3rdparty','C:\DevTools','C:\dev','C:\VTK','C:\ITK','C:\opt','C:\tools') |
                             Where-Object { Test-Path $_ }
              if (-not $searchRoots) { $searchRoots = @('C:\') }
              Write-Host "searching: $($searchRoots -join ', ')  (depth 8)"
              foreach ($pat in @('VTKConfig.cmake','vtk-config.cmake','ITKConfig.cmake','Qt6Config.cmake')) {
                $hits = Get-ChildItem $searchRoots -Recurse -Filter $pat -Depth 8 -Force -ErrorAction SilentlyContinue |
                        Select-Object -First 6
                if ($hits) {
                  foreach ($x in $hits) {
                    Write-Host "  $pat -> $($x.FullName)"
                    if ($pat -like 'VTK*' -or $pat -like 'vtk*') {
                      $dir = Split-Path $x.FullName
                      $verFile = Join-Path $dir 'VTKConfigVersion.cmake'
                      if (Test-Path $verFile) {
                        $v = Select-String -Path $verFile -Pattern 'PACKAGE_VERSION\s+"?([0-9.]+)' -ErrorAction SilentlyContinue | Select-Object -First 1
                        if ($v) { Write-Host "        version: $($v.Matches[0].Groups[1].Value)" }
                      }
                      $qtMod = Get-ChildItem $dir -Filter '*GUISupportQt*' -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1
                      if ($qtMod) { Write-Host "        Qt-enabled: YES ($($qtMod.Name))" }
                      else {
                        $grep = Select-String -Path $x.FullName -Pattern 'GUISupportQt' -ErrorAction SilentlyContinue | Select-Object -First 1
                        if ($grep) { Write-Host "        Qt-enabled: YES (referenced in config)" } else { Write-Host "        Qt-enabled: NOT DETECTED" }
                      }
                    }
                  }
                } else { Write-Host "  $pat -> none found" }
              }

              # ------------------------------------------------------------------------------------
              # Tools: resolve by LOCATION, not PATH. The agent runs as a machine account in session 0,
              # whose PATH is not an interactive session's - v1 called cmake/ninja/git absent because of
              # that, while the agent had just used git to check out a repo.
              # ------------------------------------------------------------------------------------
              Section 'Build tools - resolved by location, not PATH'
              Write-Host "PATH as the agent sees it:"
              ($env:PATH -split ';') | Where-Object { $_ } | ForEach-Object { Write-Host "    $_" }
              Write-Host ""
              foreach ($tool in @('cmake.exe','ninja.exe','git.exe')) {
                $found = @()
                $c = Get-Command $tool -ErrorAction SilentlyContinue
                if ($c) { $found += $c.Source }
                $probe = @("$env:ProgramFiles\CMake\bin\$tool",
                           "$env:ProgramFiles\Git\cmd\$tool",
                           "$env:ProgramFiles\Git\bin\$tool",
                           "${env:ProgramFiles(x86)}\CMake\bin\$tool",
                           "C:\agent\externals\git\cmd\$tool",
                           "C:\agent\externals\git\bin\$tool") | Where-Object { Test-Path $_ }
                $found += $probe
                $vsw = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
                if (Test-Path $vsw) {
                  $vs = & $vsw -latest -products * -property installationPath 2>$null
                  if ($vs) {
                    $inVs = Get-ChildItem (Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake') -Recurse -Filter $tool -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
                    if ($inVs) { $found += $inVs.FullName }
                  }
                }
                $found = $found | Select-Object -Unique
                if ($found) {
                  foreach ($f in $found) {
                    $ver = try { (& $f --version 2>&1 | Select-Object -First 1) } catch { '(version query failed)' }
                    Write-Host ("  {0,-10} {1}" -f $tool, $f)
                    Write-Host ("             {0}" -f $ver)
                  }
                } else { Write-Host "  $tool : not found in PATH or any known location" }
              }

              Section 'Visual Studio / MSVC   (dev box has VS 18.6.11828.311 / MSVC 14.51.36231)'
              $vsw = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
              if (Test-Path $vsw) {
                & $vsw -products * -format value -property installationPath 2>&1 | ForEach-Object {
                  Write-Host "  install: $_"
                  $mv = Join-Path $_ 'VC\Tools\MSVC'
                  if (Test-Path $mv) { Get-ChildItem $mv -Directory | ForEach-Object { Write-Host "      MSVC $($_.Name)" } }
                }
                & $vsw -products * -format value -property installationVersion 2>&1 | ForEach-Object { Write-Host "  version: $_" }
              } else { Write-Host "  vswhere absent" }

              Section 'Qt'
              Write-Host "  QTDIR env: '$env:QTDIR'"
              if (Test-Path 'C:\Qt') {
                Get-ChildItem 'C:\Qt' -Directory | ForEach-Object {
                  Write-Host "  C:\Qt\$($_.Name)"
                  Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "      $($_.Name)" }
                }
              } else { Write-Host "  C:\Qt absent" }

              Section 'vcpkg'
              $vcs = @($env:VCPKG_ROOT,'C:\vcpkg','C:\DevTools\vcpkg','C:\dev\vcpkg','C:\tools\vcpkg') | Where-Object { $_ -and (Test-Path $_) }
              if ($vcs) {
                foreach ($v in $vcs) {
                  Write-Host "  root: $v"
                  $g = Get-Command git -ErrorAction SilentlyContinue
                  if ($g) { Write-Host "    commit: $(& git -C $v rev-parse HEAD 2>&1)" }
                  $exe = Join-Path $v 'vcpkg.exe'
                  if (Test-Path $exe) {
                    $lst = & $exe list 2>&1
                    Write-Host "    entries: $(($lst | Measure-Object).Count)   x64-windows-static: $(($lst | Select-String 'x64-windows-static' | Measure-Object).Count)"
                  } else { Write-Host "    vcpkg.exe missing (not bootstrapped)" }
                }
              } else { Write-Host "  vcpkg not found in the usual roots" }

              Section 'ModuleWorks SDK   (licensed, ~4.5 GB)'
              $mwHits = Get-ChildItem 'C:\' -Recurse -Directory -Filter '*ModuleWorks*' -Depth 4 -Force -ErrorAction SilentlyContinue | Select-Object -First 6
              if ($mwHits) { $mwHits | ForEach-Object { Write-Host "  $($_.FullName)" } }
              else { Write-Host "  no directory matching *ModuleWorks* within depth 4 of C:\" }
              $ppf = Get-ChildItem 'C:\' -Recurse -Filter 'deploy_ppf.exe' -Depth 6 -Force -ErrorAction SilentlyContinue | Select-Object -First 2
              if ($ppf) { $ppf | ForEach-Object { Write-Host "  PPFramework deploy tool: $($_.FullName)" } }

              # Structural check against the known-good dev box layout: the SDK root holds quickstart/,
              # and quickstart/ holds both a marker DLL and the licence. Catches the classic
              # double-nesting a ZIP extraction produces (SDK ends up one level too deep).
              $mwRoot = [Environment]::GetEnvironmentVariable('ONEMILL_MODULEWORKS_DIR','Machine')
              if ($mwRoot) {
                $mwRoot = $mwRoot -replace '/','\'
                Write-Host "  MODULEWORKS_DIR resolves to: $mwRoot  (exists: $(Test-Path $mwRoot))"
                foreach ($rel in @('quickstart','MachSim','MachineBuilder','PPFramework')) {
                  Write-Host ("    {0,-16} {1}" -f $rel, $(if (Test-Path (Join-Path $mwRoot $rel)) { 'present' } else { 'MISSING' }))
                }
                $qs = Join-Path $mwRoot 'quickstart'
                if (Test-Path $qs) {
                  Write-Host ("    marker DLL 5axcore.dll  {0}" -f $(if (Test-Path (Join-Path $qs '5axcore.dll')) { 'present' } else { 'MISSING - extraction may be nested one level too deep' }))
                  # Licence presence and freshness ONLY. Never echo the contents: a build log is
                  # readable by anyone with repo access, and a licence key does not belong in one.
                  $lic = Join-Path $qs 'mwSupport.lic'
                  if (Test-Path $lic) {
                    $f = Get-Item $lic
                    Write-Host ("    mwSupport.lic           present  {0} bytes, modified {1:yyyy-MM-dd}" -f $f.Length, $f.LastWriteTime)
                  } else {
                    Write-Host "    mwSupport.lic           MISSING - ModuleWorks will fail at RUNTIME, not at build time"
                  }
                }
              } else { Write-Host "  ONEMILL_MODULEWORKS_DIR not set, cannot do the structural check" }

              Section 'ONEMILL_* machine environment variables'
              foreach ($n in @('ONEMILL_QTDIR','ONEMILL_VCPKG_ROOT','ONEMILL_VTK_DIR','ONEMILL_MODULEWORKS_DIR')) {
                $v = [Environment]::GetEnvironmentVariable($n,'Machine')
                if ($v) { Write-Host ("  {0,-26} = {1}" -f $n, $v) } else { Write-Host ("  {0,-26} <NOT SET>" -f $n) }
              }
              Write-Host ""
              Write-Host "Inventory complete. Conclusions belong in the run summary, not in this script -"
              Write-Host "v1 drew them from failed guesses and got them wrong."
              exit 0
            displayName: 'Inventory: discover, then report'

  - stage: Shutdown
    displayName: 'Stop Instance After Build'
    dependsOn:
      - Warmup
      - AgentInventory        # was BuildAndTest upstream; that stage was MIRAGE-specific and dropped
    condition: always()  # Always run to stop instance even if build fails
    variables:
      StartedInstanceId: $[ stageDependencies.Warmup.ManageCapacity.outputs['CheckCapacity.StartedInstanceId'] ]
    jobs:
      - job: StopInstance
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: none
          - task: AWSShellScript@1
            displayName: 'Stop the Instance That Ran This Build'
            inputs:
              awsCredentials: '$(AWS_SERVICE_CONNECTION)'
              regionName: 'eu-west-1'
              scriptType: 'inline'
              inlineScript: |
                set -e
                
                INSTANCE_TO_STOP="$(StartedInstanceId)"
                
                echo "======================================="
                echo "Shutting down instance from this build"
                echo "Instance ID: $INSTANCE_TO_STOP"
                echo "======================================="
                
                if [ -z "$INSTANCE_TO_STOP" ]; then
                    echo "⚠️  No instance ID passed from Warmup stage"
                    echo "⚠️  Skipping shutdown"
                    exit 0
                fi
                
                # Verify instance is running
                STATE=$(aws ec2 describe-instances \
                    --instance-ids "$INSTANCE_TO_STOP" \
                    --query 'Reservations[0].Instances[0].State.Name' \
                    --output text 2>/dev/null || echo "not-found")
                
                echo "Instance state: $STATE"
                
                if [ "$STATE" = "pending" ]; then
                    # Run cancelled during Warmup: the instance is still starting. A pending
                    # instance cannot be stopped, so wait until it is running first.
                    echo "⏳ Instance is still starting (pending), waiting until it is running so it can be stopped"
                    aws ec2 wait instance-running --instance-ids "$INSTANCE_TO_STOP"
                    STATE="running"
                fi

                if [ "$STATE" != "running" ]; then
                    echo "⚠️  Instance is not running (state: $STATE), skipping shutdown"
                    exit 0
                fi
                
                echo "⏳ Waiting 60 seconds before stopping instance to allow post-job cleanup to finish"
                sleep 60

                echo "🛑 Stopping instance: $INSTANCE_TO_STOP"

                if aws ec2 stop-instances --instance-ids "$INSTANCE_TO_STOP"; then
                  echo "Stop command sent successfully. Checking instance state..."
                  max_wait=30
                  check_interval=5
                  waited=0

                  while [ $waited -lt $max_wait ]; do
                    CURRENT_STATE=$(aws ec2 describe-instances \
                      --instance-ids "$INSTANCE_TO_STOP" \
                      --query 'Reservations[0].Instances[0].State.Name' \
                      --output text 2>/dev/null || echo "error")

                    echo "Instance state after ${waited}s: $CURRENT_STATE"

                    if [ "$CURRENT_STATE" = "stopping" ] || [ "$CURRENT_STATE" = "stopped" ]; then
                      echo "✅ Instance $INSTANCE_TO_STOP is stopping"
                      exit 0
                    elif [ "$CURRENT_STATE" = "error" ]; then
                      echo "❌ Error checking instance state"
                      exit 1
                    fi

                    sleep $check_interval
                    waited=$((waited + check_interval))
                  done

                  echo "⚠️  Instance did not enter stopping state within ${max_wait}s"
                  exit 1
                else
                    echo "❌ Failed to send stop command to instance $INSTANCE_TO_STOP"
                    exit 1
                fi

# OneMill Windows build pipeline - self-hosted EC2 agent
#
# Ported from the `azure-pipelines` branch (commit 8cee220, created by the ADO wizard and then
# adapted from ips-suite2/pipelines/build-validation-windows.yaml). Two of that file's three stages
# are kept VERBATIM because they are correct and hard-won:
#
#   Warmup   - checks how many candidate EC2 instances are already running, starts one if there is
#              capacity, and publishes its id so Shutdown can stop exactly that one
#   Shutdown - stops the instance this run started; `condition: always()` so a failed build still
#              releases it, and it handles the pending-instance case a cancelled Warmup leaves behind
#
# Its third stage (BuildAndTest) was DISCARDED: 52 of its lines are MIRAGE/SuperbuildEngine content
# (MIRAGE_Tests.exe, SB_OUTPUT_KEY, 3rdparty/out/install, MIRAGE-data LFS fixtures), none of which
# exists in OneMill. Dropped rather than half-edited, because a half-ported build stage that appears
# to work is worse than an absent one. SB_CONFIG, SB_OUTPUT_KEY and AWS_ECR_SERVICE_CONNECTION went
# with it; the two kept stages reference none of them - verified by grep, not assumed.
#
# PAYLOAD: configure -> build -> install_full -> verify -> publish a downloadable zip.
#
# The agent was forked from a suite-aws-pool image and then provisioned with the FIVE external
# dependencies OneMill needs: Qt 6.10.2, the Qt-enabled VTK 9.5 install tree, the licensed
# ModuleWorks SDK with its mwSupport.lic in bin/ (the 2026.08 layout), vcpkg at the pinned commit with 146
# x64-windows-static packages, and the Polygonica SDK. Polygonica was missed on the first pass
# because MillingBackend reads it from $ENV{POLYGONICA_DIR} as a fallback, so it never appeared in
# CMakeUserPresets.json and no developer had to think about it - a clean agent found it in seconds.
#
# An earlier inventory stage tried to establish readiness by searching the filesystem and produced
# two false negatives from its own arbitrary limits (-Depth 5, then -First 6). Configure replaced
# it because find_package() resolving is the real question, not whether a file search finds a path.
#
# The staged tree is verified before publishing - not against reference numbers from some machine,
# which drift with every SDK or dependency change, but against what has to be there: both exes,
# every module DLL, each ModuleWorks deps/ with its licence, the interpreter, the product version,
# and generous floors that only catch a grossly short payload. install_full exiting 0 is not
# sufficient evidence: an artifact that launches but is missing a module or its config is worse
# than one that fails loudly in CI.
#
# VERSION: CreateCadsVersion@3 (GitVersion, default configuration - the company scheme every other
# CADS product uses) sets Build.BuildNumber to the product version, e.g. 2.2.0.60-alpha. It is passed
# to configure as ONEMILL_VERSION, which stamps it into every first-party binary and into the
# installed mainAppConfig.json; the verify step checks that all three agree.
#
# The zip is named from that version. It contains mwSupport.lic, because the build copies it from
# the SDK's bin/ into each ModuleWorks deps/ folder and install_full stages those - the app does
# not run without it. Note that this means anyone with project read access can download the licence; Robert's hand-built release zips already worked
# this way, so it is the existing distribution posture rather than a new one.
#
# NOTE the VsDevCmd step below is REQUIRED, not decorative: the agent runs as a machine account whose
# PATH contains no cmake, ninja or MSVC. They exist only under VS's Common7\IDE\CommonExtensions, so
# without initialising the VS environment `cmake` is not even callable. Established by inventory,
# not assumed.
#
# `trigger: none` ON PURPOSE. This pipeline starts a billable EC2 instance, so it must not fire on
# every push to develop the way the guard does. Run it manually until the build stage exists and the
# team has decided whether it should gate develop.

trigger: none
pr: none

# SIGNING: off by default - a signed run is a delivery. It takes the Trusted Signing credentials from
# the variable group, signs exactly the binaries the first-party manifest lists - never a wildcard -
# with signtool and the Artifact Signing plug-in installed on the agent, and fails unless each one is
# then signed by CADS GmbH with a timestamp. Unsigned runs never reference the variable group, so they
# work without access to it, and their steps are unchanged.
parameters:
  - name: buildSigned
    displayName: 'Sign the first-party binaries (Azure Trusted Signing)'
    type: boolean
    default: false

variables:
  CANDIDATE_AGENTS: 'i-0acdb789bdfe09eac'
  MAX_CONCURRENT_INSTANCES: 1        # limited by the org's parallel-job allocation
  AWS_SERVICE_CONNECTION: 'OneMill Staging AWS Credentials'
  SELF_HOSTED_POOL: 'onemill-aws-windows-pool'
  QT_VERSION: 6.10.2
  QTDIR: 'C:\Qt\$(QT_VERSION)\msvc2022_64'

stages:
  - stage: Warmup
    displayName: 'Manage Windows Instance Capacity'
    jobs:
      - job: ManageCapacity
        pool:
          # Pinned, not ubuntu-latest: that label moves to a new Ubuntu on Microsoft's date, and this
          # job starts a billable instance - an image change should be ours to make and test.
          vmImage: 'ubuntu-24.04'
        steps:
          - checkout: none
          - task: AWSShellScript@1
            name: CheckCapacity
            displayName: 'Check Capacity and Start Instance if Needed'
            inputs:
              awsCredentials: '$(AWS_SERVICE_CONNECTION)'
              regionName: 'eu-west-1'
              scriptType: 'inline'
              inlineScript: |
                set -e
                
                # Parse candidate instances
                CANDIDATES="$(CANDIDATE_AGENTS)"
                MAX_INSTANCES=$(MAX_CONCURRENT_INSTANCES)
                IFS=',' read -ra INSTANCES <<< "$CANDIDATES"
                
                echo "========================================"
                echo "Checking capacity for pipeline execution"
                echo "Candidate instances: ${INSTANCES[*]}"
                echo "Max concurrent instances: $MAX_INSTANCES"
                echo "========================================"

                # Publish the instance ID the moment the start call succeeds, BEFORE the
                # multi-minute readiness waits: a run cancelled during those waits must still
                # hand the ID to the Shutdown stage, or the instance keeps running forever.
                claim_started_instance() {
                  echo "##vso[task.setvariable variable=StartedInstanceId;isOutput=true]$1"
                }

                # Atomically start AND claim an instance. start-instances succeeds even when the
                # instance is already pending/running, so the exit code alone cannot detect a
                # concurrent Warmup racing us to the same stopped instance. Only the caller that
                # actually flips it stopped -> pending (PreviousState=stopped) owns it; everyone
                # else must treat the instance as taken.
                start_and_claim_instance() {
                  local instance_id="$1"
                  local prev_state

                  prev_state=$(aws ec2 start-instances --instance-ids "$instance_id" \
                    --query 'StartingInstances[0].PreviousState.Name' \
                    --output text 2>/dev/null || echo "start-failed")

                  if [ "$prev_state" != "stopped" ]; then
                    echo "⚠️  Could not claim $instance_id (previous state: $prev_state)"
                    return 1
                  fi

                  claim_started_instance "$instance_id"
                }

                publish_started_instance() {
                  local instance_id="$1"
                  local agent_name

                  agent_name=$(aws ec2 describe-tags \
                    --filters "Name=resource-id,Values=$instance_id" "Name=key,Values=Name" \
                    --query 'Tags[0].Value' \
                    --output text 2>/dev/null || echo "")

                  if [ -z "$agent_name" ] || [ "$agent_name" = "None" ]; then
                    echo "##vso[task.logissue type=error]Instance $instance_id has no Name tag matching its Azure Agent.Name"
                    return 1
                  fi

                  echo "##vso[task.setvariable variable=StartedAgentName;isOutput=true]$agent_name"
                }
                
                # Check current state of all instances
                RUNNING_COUNT=0
                STOPPED_INSTANCES=()
                STOPPING_INSTANCES=()
                
                for instance_id in "${INSTANCES[@]}"; do
                    instance_id=$(echo "$instance_id" | tr -d ' ')
                    
                    STATE=$(aws ec2 describe-instances \
                        --instance-ids "$instance_id" \
                        --query 'Reservations[0].Instances[0].State.Name' \
                        --output text 2>/dev/null || echo "not-found")
                    
                    echo "Instance $instance_id: $STATE"
                    
                    if [ "$STATE" = "running" ] || [ "$STATE" = "pending" ]; then
                        RUNNING_COUNT=$((RUNNING_COUNT + 1))
                    elif [ "$STATE" = "stopped" ]; then
                        STOPPED_INSTANCES+=("$instance_id")
                    elif [ "$STATE" = "stopping" ]; then
                        STOPPING_INSTANCES+=("$instance_id")
                    fi
                done
                
                echo "Currently running/starting: $RUNNING_COUNT instances"
                echo "Available stopped instances: ${#STOPPED_INSTANCES[@]}"
                echo "Currently stopping instances: ${#STOPPING_INSTANCES[@]}"

                if [ "$RUNNING_COUNT" -ge "$MAX_INSTANCES" ]; then
                    echo "❌ ERROR: Capacity limit reached: $RUNNING_COUNT of $MAX_INSTANCES instances are already running or starting."
                    exit 1
                fi

                # Decision logic: prioritize stopped instances, then handle stopping instances
                if [ ${#STOPPED_INSTANCES[@]} -gt 0 ]; then
                    # Try every stopped instance: a lost claim race just means another pipeline
                    # took that one, the next candidate is usually still free.
                    for INSTANCE_TO_START in "${STOPPED_INSTANCES[@]}"; do
                        echo "🚀 Starting stopped instance: $INSTANCE_TO_START"

                        if start_and_claim_instance "$INSTANCE_TO_START"; then
                            aws ec2 wait instance-running --instance-ids "$INSTANCE_TO_START"
                            aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_TO_START"
                            echo "✅ Instance $INSTANCE_TO_START is ready"

                            publish_started_instance "$INSTANCE_TO_START"
                            CLAIMED_INSTANCE=1
                            break
                        fi

                        echo "⚠️  Lost $INSTANCE_TO_START to a concurrent run, trying next stopped instance..."
                    done

                    if [ -z "$CLAIMED_INSTANCE" ]; then
                        echo "❌ ERROR: All stopped instances were claimed by concurrent runs"
                        exit 1
                    fi
                    
                elif [ ${#STOPPING_INSTANCES[@]} -gt 0 ]; then
                    # No stopped instances, but stopping instances available - wait for one
                    echo "⏳ No stopped instances available, but found stopping instances: ${STOPPING_INSTANCES[*]}"
                    echo "Waiting for a stopping instance to become available..."
                    
                    max_wait=120
                    waited=0

                    while [ ${#STOPPING_INSTANCES[@]} -gt 0 ] && [ $waited -lt $max_wait ]; do
                        sleep 15
                        waited=$((waited + 15))
                        STILL_STOPPING=()
                        NEWLY_STOPPED=()
                        
                        for instance_id in "${STOPPING_INSTANCES[@]}"; do
                            STATE=$(aws ec2 describe-instances \
                                --instance-ids "$instance_id" \
                                --query 'Reservations[0].Instances[0].State.Name' \
                                --output text 2>/dev/null || echo "not-found")
                            
                            if [ "$STATE" = "stopping" ]; then
                                STILL_STOPPING+=("$instance_id")
                            elif [ "$STATE" = "stopped" ]; then
                                echo "✅ Instance $instance_id finished stopping"
                                NEWLY_STOPPED+=("$instance_id")
                            fi
                        done
                        
                        # If any instance became available, start it immediately
                        if [ ${#NEWLY_STOPPED[@]} -gt 0 ]; then
                            INSTANCE_TO_START="${NEWLY_STOPPED[0]}"
                            
                            # Double-check the instance is still stopped (race condition protection)
                            CURRENT_STATE=$(aws ec2 describe-instances \
                                --instance-ids "$INSTANCE_TO_START" \
                                --query 'Reservations[0].Instances[0].State.Name' \
                                --output text 2>/dev/null || echo "not-found")
                            
                            if [ "$CURRENT_STATE" = "stopped" ]; then
                                echo "🚀 Starting newly available instance: $INSTANCE_TO_START"
                                
                                # Try to start the instance - may fail if another pipeline grabbed it
                                if start_and_claim_instance "$INSTANCE_TO_START"; then
                                    aws ec2 wait instance-running --instance-ids "$INSTANCE_TO_START"
                                    aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_TO_START"
                                    echo "✅ Instance $INSTANCE_TO_START is ready"
                                    
                                    publish_started_instance "$INSTANCE_TO_START"
                                    CLAIMED_INSTANCE=1
                                    break
                                else
                                    echo "⚠️  Failed to start $INSTANCE_TO_START (likely race condition), continuing search..."
                                fi
                            else
                                echo "⚠️  Instance $INSTANCE_TO_START is no longer stopped ($CURRENT_STATE), continuing search..."
                            fi
                        fi
                        
                        STOPPING_INSTANCES=("${STILL_STOPPING[@]}")
                        
                        if [ ${#STOPPING_INSTANCES[@]} -gt 0 ]; then
                            echo "Still waiting for: ${STOPPING_INSTANCES[*]} ($waited/$max_wait seconds)"
                        fi
                    done

                    # Check the claim flag, NOT the remaining-stopping list: a successful claim
                    # breaks out of the loop with other instances possibly still stopping, and a
                    # lost race can drain the list without any claim.
                    if [ -z "$CLAIMED_INSTANCE" ]; then
                        echo "❌ ERROR: No instance could be claimed within ${max_wait}s"
                        exit 1
                    fi
                else
                    # No stopped or stopping instances available
                    echo "❌ ERROR: No available instances found!"
                    echo "   - Stopped instances: ${#STOPPED_INSTANCES[@]}"
                    echo "   - Stopping instances: ${#STOPPING_INSTANCES[@]}"
                    echo "   - Running instances: $RUNNING_COUNT"
                    exit 1
                fi




  - stage: Configure
    displayName: 'Configure, build, install and publish'
    dependsOn: Warmup
    jobs:
      - job: ConfigureJob
        displayName: 'cmake --preset onemill-config-ci-win-msvc-x64-relwithdebinfo'
        timeoutInMinutes: 150
        pool:
          name: '$(SELF_HOSTED_POOL)'
        # Only a signed run may reference the group - it is shared from project IPS Suite, and an
        # unauthorised reference would stop every run at queue time, signed or not.
        ${{ if eq(parameters.buildSigned, true) }}:
          variables:
            - group: TrustedSigning-Shared
        steps:
          # Configure walks add_subdirectory() into all 26 submodules, so the whole tree is
          # required - unlike the guard, which deliberately checks out none of them.
          # Full history and tags, not a shallow clone: the version is counted from the nearest vX.Y.Z
          # tag, and a shallow checkout has neither the tag nor the commits since it.
          - checkout: self
            submodules: recursive
            fetchDepth: 0
            fetchTags: true
            persistCredentials: true
            displayName: 'Checkout superproject + all submodules'

          # Sets Build.BuildNumber to the product version. The task also stamps every .csproj and
          # pom.xml it finds; OneMill has none, and the pattern is deliberately one that matches
          # nothing, as CaseDesigner does.
          - task: CreateCadsVersion@3
            displayName: 'VERSION (CreateCadsVersion - GitVersion, company scheme)'
            inputs:
              csprojfilepathpattern: 'onemill-has-no-csproj/**/*.csproj'

          # WHY THIS STEP EXISTS: the inventory established that the agent's PATH is bare -
          # cmake and ninja live only under VS's Common7\IDE\CommonExtensions and are NOT on
          # PATH for the machine account the agent runs as. Without initialising the VS
          # environment, `cmake` is not even callable. VsDevCmd also supplies the MSVC
          # toolchain the compiler checks need.
          - task: BatchScript@1
            displayName: 'Initialize Visual Studio environment'
            inputs:
              filename: 'C:\Program Files\Microsoft Visual Studio\18\Professional\Common7\Tools\VsDevCmd.bat'
              arguments: '-arch=x64 -host_arch=x64'
              modifyEnvironment: true

          - powershell: |
              $ErrorActionPreference = 'Stop'
              Write-Host "=== toolchain as configure will see it ==="
              foreach ($t in @('cmake','ninja','cl')) {
                $c = Get-Command $t -ErrorAction SilentlyContinue
                if ($c) { Write-Host ("  {0,-6} {1}" -f $t, $c.Source) } else { Write-Host "  $t NOT RESOLVABLE" }
              }
              cmake --version | Select-Object -First 1 | Write-Host
              Write-Host ""
              Write-Host "=== the five inputs the preset reads ==="
              foreach ($n in @('ONEMILL_QTDIR','ONEMILL_VCPKG_ROOT','ONEMILL_VTK_DIR','ONEMILL_MODULEWORKS_DIR','ONEMILL_POLYGONICA_DIR')) {
                $v = [Environment]::GetEnvironmentVariable($n,'Machine')
                Write-Host ("  {0,-26} {1}" -f $n, $(if ($v) { $v } else { '<NOT SET>' }))
                if (-not $v) { throw "$n is not set on this machine - the preset cannot resolve its toolchain" }
              }
              # Fail here with a clear message rather than letting find_package produce a
              # confusing error 40 lines into configure output.
              $vtk = ([Environment]::GetEnvironmentVariable('ONEMILL_VTK_DIR','Machine')) -replace '/','\'
              if (-not (Test-Path (Join-Path $vtk 'vtk-config.cmake'))) {
                throw "ONEMILL_VTK_DIR does not contain vtk-config.cmake: $vtk"
              }
              Write-Host "  VTK config resolves: $vtk\vtk-config.cmake"
              # Polygonica: the fifth dependency, and the one a developer never notices because
              # MillingBackend/CMakeLists.txt falls back to $ENV{POLYGONICA_DIR}. Check both paths
              # the build actually consumes, not just that the directory exists.
              $pg = ([Environment]::GetEnvironmentVariable('ONEMILL_POLYGONICA_DIR','Machine')) -replace '/','\'
              if (-not (Test-Path (Join-Path $pg 'include\pg'))) {
                throw "ONEMILL_POLYGONICA_DIR has no include\pg subdirectory: $pg"
              }
              $pgLib = Join-Path $pg 'lib\amd\winxp64\msoft143\dds_\pg.lib'
              if (-not (Test-Path $pgLib)) {
                throw "Polygonica pg.lib missing: expected $pgLib"
              }
              Write-Host "  Polygonica resolves: $pg  (include\pg + msoft143\dds_\pg.lib)"

              # vcpkg completeness. A successful `vcpkg install libigl` still yields a tree OneMill
              # cannot compile: libigl's own ray_mesh_intersect.cpp does
              #   extern "C" { #include "raytri.c" }
              # but the port (2.6.0#2) installs *.h and *.cpp and NOT that single .c file. The failure
              # is a C1083 roughly 60 targets into MeshLogic - five minutes of build time to learn
              # something checkable in milliseconds. Reinstalling does not help; the file must be
              # placed by hand. Third-party packaging bug, documented in vcpkgPackages.txt.
              $vc = ([Environment]::GetEnvironmentVariable('ONEMILL_VCPKG_ROOT','Machine')) -replace '/','\'
              $igl = Join-Path $vc 'installed\x64-windows-static\include\igl'
              if (Test-Path $igl) {
                $n = @(Get-ChildItem $igl -File).Count
                Write-Host ("  vcpkg libigl headers: {0} files" -f $n)
                if (-not (Test-Path (Join-Path $igl 'raytri.c'))) {
                  throw ("libigl is missing raytri.c in $igl`n" +
                         "  The vcpkg port does not install it although its own ray_mesh_intersect.cpp " +
                         "includes it. Reinstalling libigl will NOT fix this - copy raytri.c into that " +
                         "directory from libigl's source or a working machine. See the post-install fix " +
                         "in vcpkgPackages.txt.")
                }
                Write-Host "  raytri.c present (the libigl port omits it - see vcpkgPackages.txt)"
              } else {
                throw "no libigl headers under $igl - is ONEMILL_VCPKG_ROOT correct and the port installed?"
              }
              $mw = ([Environment]::GetEnvironmentVariable('ONEMILL_MODULEWORKS_DIR','Machine')) -replace '/','\'
              if (-not (Test-Path (Join-Path $mw 'bin\mwSupport.lic'))) {
                Write-Host "##vso[task.logissue type=warning]mwSupport.lic not found under $mw\bin - builds will succeed but ModuleWorks fails at RUNTIME"
              }
              Write-Host ""
              Write-Host "=== submodule tree ==="
              Write-Host "  gitlinks checked out: $((git submodule status --recursive | Measure-Object).Count) (expect 26)"
            displayName: 'Pre-flight: toolchain + preset inputs resolvable'

          - script: |
              cmake --preset onemill-config-ci-win-msvc-x64-relwithdebinfo -DONEMILL_VERSION=$(Build.BuildNumber)
            displayName: 'CONFIGURE (the real test - find_package must resolve every dependency)'

          - powershell: |
              # Configure succeeded; prove the cache actually took the intended values rather
              # than silently falling back to something else.
              $cache = 'out/build/win-msvc-x64-relwithdebinfo/CMakeCache.txt'
              if (-not (Test-Path $cache)) { throw "no CMakeCache.txt at $cache" }
              Write-Host "=== what configure resolved ==="
              foreach ($k in @('Qt6_DIR','VCPKG_ROOT','VTK_DIR','MODULEWORKS_DIR','INSTALL_DIR',
                               'VCPKG_TARGET_TRIPLET','CMAKE_BUILD_TYPE','CMAKE_CXX_COMPILER',
                               'DEPLOY_DIR','DEPLOY_EXE')) {
                $line = Select-String -Path $cache -Pattern "^$k[:=]" | Select-Object -First 1
                if ($line) { Write-Host "  $($line.Line)" } else { Write-Host "  $k <absent from cache>" }
              }
              Write-Host ""
              Write-Host "  install targets line from configure output is the dependency-walk check;"
              Write-Host "  build.ninja present: $(Test-Path 'out/build/win-msvc-x64-relwithdebinfo/build.ninja')"
            displayName: 'Verify the resolved cache'
            condition: succeededOrFailed()


          - script: |
              cmake --build --preset onemill-build-ci-win-msvc-x64-relwithdebinfo
            displayName: 'BUILD (target all - see the preset note on why not a target list)'

          - script: |
              cmake --build --preset onemill-install-target-ci-win-msvc-x64-relwithdebinfo
            displayName: 'INSTALL (install_full - stages app, modules, deps, interpreter)'

          - powershell: |
              $ErrorActionPreference = 'Stop'
              $staged = 'out/install/win-msvc-x64-relwithdebinfo'
              if (-not (Test-Path $staged)) { throw "install_full produced nothing at $staged" }

              # Check what has to be there rather than trusting that install_full exited 0 - an
              # artifact that downloads and launches but is missing a module or its config is
              # worse than one that fails loudly here.
              Write-Host "=== staged tree ==="
              $all = Get-ChildItem $staged -Recurse -File
              $mb  = [math]::Round(($all | Measure-Object Length -Sum).Sum/1MB,0)
              Write-Host ("  files            {0,6}" -f $all.Count)
              Write-Host ("  size MB          {0,6}" -f $mb)

              $exes = (Get-ChildItem $staged -Filter *.exe).Name
              Write-Host ("  exes             {0}   (expect MainApp.exe, Updater.exe)" -f ($exes -join ', '))

              $modDir = Join-Path $staged 'modulesBert'
              $dlls = @(Get-ChildItem $modDir -Filter *.dll -ErrorAction SilentlyContinue)
              Write-Host ("  module DLLs      {0,6}" -f $dlls.Count)

              Write-Host "  deps folders:"
              $depsOk = $true
              foreach ($m in @('ModuleMillingKalotte','ModulePostProcessor')) {
                $d = Join-Path $modDir "$m\deps"
                if (Test-Path $d) {
                  $n = @(Get-ChildItem $d -Recurse -File).Count
                  $lic = Join-Path $d 'mwSupport.lic'
                  $licTxt = if (Test-Path $lic) { "$((Get-Item $lic).Length) bytes" } else { 'MISSING' }
                  Write-Host ("      {0,-22} {1,4} files   mwSupport.lic: {2}" -f $m, $n, $licTxt)
                  if (-not (Test-Path $lic)) { $depsOk = $false }
                } else { Write-Host ("      {0,-22} MISSING" -f $m); $depsOk = $false }
              }

              $ip = Join-Path $modDir 'ModulePostProcessor\interpreter'
              if (Test-Path $ip) {
                $n = @(Get-ChildItem $ip -Recurse -File).Count
                Write-Host ("  interpreter      {0,6}" -f $n)
              } else {
                Write-Host "  interpreter      ABSENT"
                Write-Host "##vso[task.logissue type=error]No interpreter/ staged. deploy_ppf.exe must be run ONCE on this agent to create PYPY_SOURCE - see .vscode/OneMill-Setup-Ledger.md fix 8. The PostProcessor module cannot work without it."
                throw "interpreter/ missing from the staged tree"
              }

              if (-not $depsOk) { throw "a ModuleWorks deps/ folder or its mwSupport.lic is missing - the artifact would not run" }

              # One product version everywhere: the build number, every first-party binary and the
              # installed config must agree - and the first-party manifest, the list signing will work
              # from, must name exactly binaries that were staged.
              Write-Host ""
              Write-Host "=== product version ==="
              $want = "$(Build.BuildNumber)"
              $exeVer = (Get-Item (Join-Path $staged 'MainApp.exe')).VersionInfo.ProductVersion
              $cfgVer = ''
              $m = Select-String -Path (Join-Path $staged 'config\mainAppConfig.json') -Pattern '"version"\s*:\s*"([^"]+)"' | Select-Object -First 1
              if ($m) { $cfgVer = $m.Matches[0].Groups[1].Value }
              Write-Host "  Build.BuildNumber           $want"
              Write-Host "  MainApp.exe ProductVersion  $exeVer"
              Write-Host "  mainAppConfig.json version  $cfgVer"
              if ($exeVer -ne $want -or $cfgVer -ne $want) {
                throw "product version mismatch: build number '$want', MainApp.exe '$exeVer', mainAppConfig.json '$cfgVer'"
              }

              $manifest = 'out/build/win-msvc-x64-relwithdebinfo/first-party/KLSOneMill.txt'
              if (-not (Test-Path $manifest)) { throw "no first-party manifest at $manifest" }
              $entries = @(Get-Content $manifest | Where-Object { $_ })
              Write-Host ("  first-party manifest {0,6}" -f $entries.Count)
              foreach ($e in $entries) {
                $p = Join-Path $staged $e
                if (-not (Test-Path $p)) { throw "the manifest lists $e, which is not in the staged tree" }
                $v = (Get-Item $p).VersionInfo.ProductVersion
                if ($v -ne $want) { throw "$e carries version '$v', expected '$want'" }
              }

              # Modules: what the build produced, what install_full staged and what the manifest lists
              # must be the same set - compared, not counted, so a module that builds but is never
              # wired into install_full fails here, and no number has to follow the module count.
              $built    = @(Get-ChildItem 'out/build/win-msvc-x64-relwithdebinfo/bin/RelWithDebInfo/modulesBert' -Filter *.dll -ErrorAction SilentlyContinue | ForEach-Object { $_.Name })
              $stagedM  = @($dlls | ForEach-Object { $_.Name })
              $listedM  = @($entries | Where-Object { $_ -like 'modulesBert/*.dll' } | ForEach-Object { $_.Substring('modulesBert/'.Length) })
              Write-Host ("  modules built / staged / listed: {0} / {1} / {2}" -f $built.Count, $stagedM.Count, $listedM.Count)
              if ($built.Count -eq 0) { throw "no module DLLs found in the build tree - cannot compare" }
              $notStaged = @($built | Where-Object { $stagedM -notcontains $_ })
              $notBuilt  = @($stagedM | Where-Object { $built -notcontains $_ })
              $notListed = @($stagedM | Where-Object { $listedM -notcontains $_ })
              $notThere  = @($listedM | Where-Object { $stagedM -notcontains $_ })
              if ($notStaged) { throw "built but not staged by install_full: $($notStaged -join ', ')" }
              if ($notBuilt)  { throw "staged but not built in this run: $($notBuilt -join ', ')" }
              if ($notListed) { throw "staged but missing from the first-party manifest: $($notListed -join ', ')" }
              if ($notThere)  { throw "listed in the first-party manifest but not staged: $($notThere -join ', ')" }
              foreach ($exe in 'MainApp.exe', 'Updater.exe') {
                if ($entries -notcontains $exe) { throw "the first-party manifest does not list $exe" }
              }

              # Hard floors, deliberately generous: catch a grossly short payload without
              # failing on legitimate small drift between toolchains.
              if ($all.Count -lt 6000) { throw "staged tree has only $($all.Count) files - payload looks incomplete" }
              Write-Host ""
              Write-Host "  staged tree passes its floors"
            displayName: 'Verify the staged tree is complete (not merely present)'

          # Signing, in the company's order: resolve the files, validate the credentials, sign,
          # verify. Present only in a signed run.
          - ${{ if eq(parameters.buildSigned, true) }}:
            - powershell: |
                $ErrorActionPreference = 'Stop'
                # The allowlist is the first-party manifest install_full wrote - exactly our own
                # binaries, as staged. Third-party DLLs never pass through it.
                $staged   = (Resolve-Path 'out/install/win-msvc-x64-relwithdebinfo').Path
                $manifest = 'out/build/win-msvc-x64-relwithdebinfo/first-party/KLSOneMill.txt'
                if (-not (Test-Path $manifest)) { throw "no first-party manifest at $manifest - nothing to sign" }
                $entries = @(Get-Content $manifest | Where-Object { $_ })
                if ($entries.Count -eq 0) { throw "the first-party manifest is empty - nothing to sign" }
                $files = foreach ($e in $entries) {
                  $p = Join-Path $staged $e
                  if (-not (Test-Path -LiteralPath $p)) { throw "the manifest lists $e, which is not in the staged tree" }
                  (Resolve-Path -LiteralPath $p).Path
                }
                $list = Join-Path '$(Agent.TempDirectory)' 'onemill-sign-files.txt'
                Set-Content -Path $list -Value $files -Encoding ascii
                Write-Host "files to sign: $($files.Count)"
                $files | ForEach-Object { Write-Host "  $_" }
                Write-Host "##vso[task.setvariable variable=SignFileList]$list"
              displayName: 'SIGN 1/4: resolve the first-party files from the manifest'

            - powershell: |
                $ErrorActionPreference = 'Stop'
                # An undefined pipeline variable is passed on as its literal macro text, so that
                # counts as missing too. Values are never printed.
                $missing = @()
                foreach ($n in 'TRUSTEDSIGNING_TENANT_ID', 'TRUSTEDSIGNING_APP_ID', 'TRUSTEDSIGNING_APP_SECRET') {
                  $v = [Environment]::GetEnvironmentVariable($n)
                  if ([string]::IsNullOrWhiteSpace($v) -or $v.StartsWith('$(')) { $missing += $n }
                }
                if ($missing) {
                  throw "Trusted Signing credentials missing: $($missing -join ', ') - is the variable group TrustedSigning-Shared shared with this project and authorised for this pipeline?"
                }
                Write-Host "Trusted Signing credentials present"

                # The signing tools are installed on the agent once, not fetched at run time: the
                # Windows SDK's signtool and Microsoft's Artifact Signing client (the signtool
                # plug-in, Azure.CodeSigning.Dlib.dll). Both are declared by machine variables, like
                # the build's five ONEMILL_* inputs, so a rebuilt agent that lacks them fails here.
                $fix = 'Install the Artifact Signing Client Tools on the agent and set ONEMILL_SIGNTOOL / ONEMILL_ARTIFACTSIGNING_DLIB at machine scope - see Docs/Projects/KOM-18-onemill-delivery/Workplan-Signing.md'
                $signtool = [Environment]::GetEnvironmentVariable('ONEMILL_SIGNTOOL', 'Machine')
                $dlib     = [Environment]::GetEnvironmentVariable('ONEMILL_ARTIFACTSIGNING_DLIB', 'Machine')
                if (-not $signtool -or -not (Test-Path -LiteralPath $signtool)) { throw "signtool.exe not found (ONEMILL_SIGNTOOL='$signtool'). $fix" }
                if (-not $dlib -or -not (Test-Path -LiteralPath $dlib)) { throw "Azure.CodeSigning.Dlib.dll not found (ONEMILL_ARTIFACTSIGNING_DLIB='$dlib'). $fix" }
                # The plug-in needs a Windows SDK signtool of at least 10.0.22621 and does not work
                # with the 10.0.20348 SDK; it runs on .NET 8 or later (its runtimeconfig rolls forward).
                $sv = [version]((Get-Item -LiteralPath $signtool).VersionInfo.ProductVersion)
                if ($sv -lt [version]'10.0.22621.0' -or $sv.Build -eq 20348) { throw "signtool.exe $sv is not supported by the Artifact Signing plug-in (needs 10.0.22621 or later, not 20348)" }
                $net = @(Get-ChildItem 'C:\Program Files\dotnet\shared\Microsoft.NETCore.App' -Directory -ErrorAction SilentlyContinue |
                         Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' -and [version]$_.Name -ge [version]'8.0.0' })
                if (-not $net) { throw "no .NET runtime 8 or later under C:\Program Files\dotnet - the Artifact Signing plug-in needs one" }
                Write-Host ("signtool  {0}  {1}" -f $sv, $signtool)
                Write-Host ("plug-in   {0}  {1}" -f (Get-Item -LiteralPath $dlib).VersionInfo.FileVersion, $dlib)
                Write-Host (".NET      {0}" -f (($net | ForEach-Object { $_.Name }) -join ', '))
                Write-Host "##vso[task.setvariable variable=SignToolPath]$signtool"
                Write-Host "##vso[task.setvariable variable=SignDlibPath]$dlib"
              displayName: 'SIGN 2/4: validate the signing credentials and tools'
              env:
                TRUSTEDSIGNING_TENANT_ID: $(TrustedSigningTenantId)
                TRUSTEDSIGNING_APP_ID: $(TrustedSigningAppId)
                TRUSTEDSIGNING_APP_SECRET: $(TrustedSigningAppSecret)

            # signtool with the Artifact Signing plug-in - the same command line the signing task of
            # IPS Suite's installer pipeline runs, without the task: that task installs its tools at
            # run time and is deprecated. The plug-in authenticates through DefaultAzureCredential;
            # metadata.json leaves it only the service principal from the environment.
            - powershell: |
                $ErrorActionPreference = 'Stop'
                $files = @(Get-Content '$(SignFileList)')
                $meta  = Join-Path '$(Agent.TempDirectory)' 'onemill-sign-metadata.json'
                [ordered]@{
                  Endpoint               = 'https://weu.codesigning.azure.net/'
                  CodeSigningAccountName = 'TrustedSigningCads'
                  CertificateProfileName = 'CADSGmbH'
                  CorrelationId          = 'onemill-$(Build.BuildNumber)'
                  ExcludeCredentials     = @('ManagedIdentityCredential', 'WorkloadIdentityCredential',
                                             'SharedTokenCacheCredential', 'VisualStudioCredential',
                                             'VisualStudioCodeCredential', 'AzureCliCredential',
                                             'AzurePowerShellCredential', 'AzureDeveloperCliCredential',
                                             'InteractiveBrowserCredential')
                } | ConvertTo-Json | Set-Content -Path $meta -Encoding ascii
                Write-Host "signing $($files.Count) files"
                & '$(SignToolPath)' sign /v /debug /fd SHA256 /tr 'http://timestamp.acs.microsoft.com' /td SHA256 /dlib '$(SignDlibPath)' /dmdf $meta @files
                $rc = $LASTEXITCODE
                Remove-Item -LiteralPath $meta -ErrorAction SilentlyContinue
                if ($rc -ne 0) { throw "signtool failed with exit code $rc" }
              displayName: 'SIGN 3/4: sign the first-party files (signtool + Artifact Signing)'
              env:
                AZURE_TENANT_ID: $(TrustedSigningTenantId)
                AZURE_CLIENT_ID: $(TrustedSigningAppId)
                AZURE_CLIENT_SECRET: $(TrustedSigningAppSecret)

            - powershell: |
                $ErrorActionPreference = 'Stop'
                # Certificates live about three days, so a signature without a timestamp would stop
                # verifying within days. The publisher is what allow rules match on.
                $files = @(Get-Content '$(SignFileList)')
                $bad = @()
                foreach ($f in $files) {
                  $s = Get-AuthenticodeSignature -LiteralPath $f
                  $subject = if ($s.SignerCertificate) { $s.SignerCertificate.Subject } else { '' }
                  $stamped = [bool]$s.TimeStamperCertificate
                  Write-Host ("  {0,-12} timestamp={1,-5} {2}   {3}" -f $s.Status, $stamped, (Split-Path $f -Leaf), $subject)
                  if ($s.Status -ne 'Valid' -or $subject -notmatch 'CADS GmbH' -or -not $stamped) { $bad += $f }
                }
                if ($bad) { throw "$($bad.Count) of $($files.Count) first-party binaries are not validly signed by CADS GmbH with a timestamp" }
                Write-Host "all $($files.Count) first-party binaries are signed by CADS GmbH and timestamped"
              displayName: 'SIGN 4/4: every first-party binary is signed by CADS GmbH, with a timestamp'

          - powershell: |
              $ErrorActionPreference = 'Stop'
              $staged = 'out/install/win-msvc-x64-relwithdebinfo'

              # Named from the product version, which the verify step has just checked against
              # MainApp.exe and mainAppConfig.json. It carries its own build identity - the commit
              # count - so two artifacts are never ambiguous; a signed one says so.
              $name = "KLSOneMill-$(Build.BuildNumber)-relwithdebinfo${{ iif(eq(parameters.buildSigned, true), '-signed', '') }}"
              Write-Host "artifact name: $name"

              New-Item -ItemType Directory -Force 'out/artifact' | Out-Null
              $zip = "out/artifact/$name.zip"
              # bsdtar ships with Windows Server and writes a real zip; Compress-Archive is slow
              # and awkward at this size. -C so the archive root is the install tree itself, not
              # a nested out/install/... path. The top-level entries are named one by one rather
              # than as '.': '.' makes bsdtar store every path as './...', and Windows Explorer's
              # built-in zip support then shows the archive as empty and extracts nothing
              # (7-Zip copes, which is why it looked like a user problem).
              $top = @(Get-ChildItem $staged -Name)
              tar -a -c -f $zip -C $staged @top
              if ($LASTEXITCODE -ne 0) { throw "zip creation failed ($LASTEXITCODE)" }
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $za = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
              $dotted = @($za.Entries | Where-Object { $_.FullName.StartsWith('./') }).Count
              $entries = $za.Entries.Count
              $za.Dispose()
              if ($dotted -gt 0) { throw "$dotted zip entries start with './' - Windows Explorer would show the archive as empty" }
              Write-Host "zip entries: $entries, none prefixed with './'"
              $z = Get-Item $zip
              Write-Host ("zip: {0} MB" -f [math]::Round($z.Length/1MB,1))
              if ($z.Length -lt 300MB) { throw "zip is only $([math]::Round($z.Length/1MB,1)) MB - suspiciously small" }
              Write-Host "##vso[task.setvariable variable=ArtifactName]$name"
            displayName: 'Package the staged tree as a named zip'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish the downloadable artifact'
            inputs:
              targetPath: 'out/artifact'
              artifact: 'OneMillInstall'
              publishLocation: 'pipeline'

  - stage: Shutdown
    displayName: 'Stop Instance After Build'
    dependsOn:
      - Warmup
      - Configure             # was BuildAndTest upstream (MIRAGE-specific, dropped), then AgentInventory
    condition: always()  # Always run to stop instance even if build fails
    variables:
      StartedInstanceId: $[ stageDependencies.Warmup.ManageCapacity.outputs['CheckCapacity.StartedInstanceId'] ]
    jobs:
      - job: StopInstance
        pool:
          # Pinned for the same reason as ManageCapacity - and a failure here leaves an instance running.
          vmImage: 'ubuntu-24.04'
        steps:
          - checkout: none
          - task: AWSShellScript@1
            displayName: 'Stop the Instance That Ran This Build'
            inputs:
              awsCredentials: '$(AWS_SERVICE_CONNECTION)'
              regionName: 'eu-west-1'
              scriptType: 'inline'
              inlineScript: |
                set -e
                
                INSTANCE_TO_STOP="$(StartedInstanceId)"
                
                echo "======================================="
                echo "Shutting down instance from this build"
                echo "Instance ID: $INSTANCE_TO_STOP"
                echo "======================================="
                
                if [ -z "$INSTANCE_TO_STOP" ]; then
                    echo "⚠️  No instance ID passed from Warmup stage"
                    echo "⚠️  Skipping shutdown"
                    exit 0
                fi
                
                # Verify instance is running
                STATE=$(aws ec2 describe-instances \
                    --instance-ids "$INSTANCE_TO_STOP" \
                    --query 'Reservations[0].Instances[0].State.Name' \
                    --output text 2>/dev/null || echo "not-found")
                
                echo "Instance state: $STATE"
                
                if [ "$STATE" = "pending" ]; then
                    # Run cancelled during Warmup: the instance is still starting. A pending
                    # instance cannot be stopped, so wait until it is running first.
                    echo "⏳ Instance is still starting (pending), waiting until it is running so it can be stopped"
                    aws ec2 wait instance-running --instance-ids "$INSTANCE_TO_STOP"
                    STATE="running"
                fi

                if [ "$STATE" != "running" ]; then
                    echo "⚠️  Instance is not running (state: $STATE), skipping shutdown"
                    exit 0
                fi
                
                echo "⏳ Waiting 60 seconds before stopping instance to allow post-job cleanup to finish"
                sleep 60

                echo "🛑 Stopping instance: $INSTANCE_TO_STOP"

                if aws ec2 stop-instances --instance-ids "$INSTANCE_TO_STOP"; then
                  echo "Stop command sent successfully. Checking instance state..."
                  max_wait=30
                  check_interval=5
                  waited=0

                  while [ $waited -lt $max_wait ]; do
                    CURRENT_STATE=$(aws ec2 describe-instances \
                      --instance-ids "$INSTANCE_TO_STOP" \
                      --query 'Reservations[0].Instances[0].State.Name' \
                      --output text 2>/dev/null || echo "error")

                    echo "Instance state after ${waited}s: $CURRENT_STATE"

                    if [ "$CURRENT_STATE" = "stopping" ] || [ "$CURRENT_STATE" = "stopped" ]; then
                      echo "✅ Instance $INSTANCE_TO_STOP is stopping"
                      exit 0
                    elif [ "$CURRENT_STATE" = "error" ]; then
                      echo "❌ Error checking instance state"
                      exit 1
                    fi

                    sleep $check_interval
                    waited=$((waited + check_interval))
                  done

                  echo "⚠️  Instance did not enter stopping state within ${max_wait}s"
                  exit 1
                else
                    echo "❌ Failed to send stop command to instance $INSTANCE_TO_STOP"
                    exit 1
                fi
